name: Check build and publish Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: node --test api/mock-server.test.js api/auth.test.js
      - name: Check HTTPS API configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "Set repository variable API_BASE_URL to the Render HTTPS URL ending in /api"; exit 1 ;;
          esac
      - name: Build release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: >
          flutter build web --release --no-pub --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Optimize and enable direct links
        run: python3 tool/prepare_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
